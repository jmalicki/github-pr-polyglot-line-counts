name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check Prettier formatting
        run: npm run format:check

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run unit tests
        run: npm test
      
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: coverage/
          if-no-files-found: ignore

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run E2E tests (headless)
        run: npm run test:e2e
        env:
          TEST_PR_URL: 'https://github.com/jmalicki/arsync/pull/55/files'
      
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  intermittent-diagnostics:
    name: Intermittent Behavior Diagnostics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run panel visibility diagnostic (5 iterations)
        run: ITERATIONS=5 npm run test:visibility
        env:
          TEST_PR_URL: 'https://github.com/jmalicki/arsync/pull/55/files'

      - name: Run page stability race test
        run: npm run test:stability
        env:
          TEST_PR_URL: 'https://github.com/jmalicki/arsync/pull/55/files'

      - name: Run concurrent analyze test
        run: npm run test:concurrent
        env:
          TEST_PR_URL: 'https://github.com/jmalicki/arsync/pull/55/files'

      - name: Run API promise reuse test
        run: npm run test:api-reuse
        env:
          TEST_PR_URL: 'https://github.com/jmalicki/arsync/pull/55/files'

      - name: Run script reinjection test
        run: npm run test:reinjection
        env:
          TEST_PR_URL: 'https://github.com/jmalicki/arsync/pull/55/files'

      - name: Upload diagnostic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-screenshots
          path: tests/screenshots/
          if-no-files-found: ignore

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify extension structure
        run: |
          test -f manifest.json || exit 1
          test -f content.js || exit 1
          test -f styles.css || exit 1
          test -d lib || exit 1
          test -d icons || exit 1
          echo "✅ All required extension files present"
      
      - name: Validate manifest.json
        run: |
          node -e "JSON.parse(require('fs').readFileSync('manifest.json', 'utf8'))" && echo "✅ manifest.json is valid JSON"

